/* Layout : appli mobile en une colonne — en-tête logo, pile de cartes illustrées, commandes en bas. Éditeur en panneau plein écran. */
:root{
  --blanc:#FAF8F5; --beige:#E2D8CB; --beige-l:#EFE8DE; --beige-3:#C5B8A8;
  --kaki:#4C533B; --kaki-l:#6B7453; --kaki-p:#D4DAC8;

  --body:"Jost", "Futura", "Helvetica Neue", Arial, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--blanc);color:var(--noir);font-family:var(--body);font-weight:300;-webkit-tap-highlight-color:transparent;

.welcome .meta{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--beige)}
.welcome .go{background:var(--terra);color:var(--white);border-color:var(--terra);padding:14px 34px;font-weight:500;margin-top:6px}
.welcome .go:hover{background:#A36452;border-color:#A36452}
.how{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;width:100%;margin-top:6px}
.how div{border:1px solid rgba(250,248,245,.25);border-radius:8px;padding:10px 6px;font-size:.72rem;line-height:1.3;color:var(--beige)}
.how b{display:block;font-family:var(--display);font-size:1.15rem;font-weight:500;color:var(--blanc)}

/* cartes */
.stack{position:relative;height:500px;max-height:64vh;min-height:420px}
.card{position:absolute;inset:0;background:var(--white);border:1px solid var(--beige);border-radius:12px;overflow:hidden;
  box-shadow:0 22px 44px -28px rgba(76,83,59,.5);display:flex;flex-direction:column;touch-action:none;user-select:none;cursor:grab;will-change:transform}
.card.under{transform:scale(.95) translateY(16px);opacity:.75;cursor:default}
.visual{position:relative;flex:0 0 46%;background:var(--beige-l);display:flex;align-items:center;justify-content:center;overflow:hidden}
.visual img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.visual svg{width:80%;height:90%}
.visual.split{display:grid;grid-template-columns:1fr 1fr}
.visual.split>div{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative}
.visual.split>div+div{border-left:1px solid var(--beige)}
.visual.split svg{width:100%;height:80%}
.visual.split span{font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--kaki-l)}

.txt{flex:1;padding:18px 22px 20px;display:flex;flex-direction:column;min-height:0}
.kicker{font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--terra)}
.card h2{font-family:var(--display);font-weight:500;font-size:2rem;line-height:1.05;margin:6px 0 0;text-wrap:balance;color:var(--noir)}
.card p{color:var(--gris);font-size:1.02rem;line-height:1.45;margin:8px 0 0}
.opts{margin-top:auto;display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--beige);padding:12px 22px 16px;font-size:.8rem}
.opts span:last-child{text-align:right}
.opts b{display:block;font-weight:500;font-size:.98rem}
.opts .l b{color:var(--terra)}.opts .r b{color:var(--kaki)}
.opts small{color:var(--gris);letter-spacing:.1em;text-transform:uppercase;font-size:.6rem}
.stamp{position:absolute;top:18px;padding:5px 14px;border:2px solid;border-radius:4px;font-family:var(--display);font-weight:500;font-size:1.5rem;
  opacity:0;pointer-events:none;background:rgba(255,255,255,.92);z-index:2}
.stamp.l{left:16px;color:var(--terra);border-color:var(--terra);transform:rotate(-9deg)}
.stamp.r{right:16px;color:var(--kaki);border-color:var(--kaki);transform:rotate(9deg)}
.stamp.d{left:50%;top:auto;bottom:22%;transform:translateX(-50%);color:var(--gris);border-color:var(--gris);font-size:1.25rem}

.controls{display:grid;grid-template-columns:1fr .78fr 1fr;gap:10px;align-items:stretch}
button,.btn{font-family:var(--body);font-size:.88rem;font-weight:400;color:var(--noir);background:var(--white);border:1px solid var(--beige);
  border-radius:999px;padding:12px 14px;cursor:pointer;text-decoration:none;text-align:center;transition:border-color .15s,background .15s}
button:hover,.btn:hover{border-color:var(--kaki)}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible{outline:2px solid var(--terra);outline-offset:2px}
.no,.yes,.skipbtn{min-height:68px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15;border-radius:16px;padding:12px 8px;font-size:1rem;font-weight:500;box-shadow:0 8px 18px -12px rgba(26,26,24,.55)}
.no,.yes{color:var(--white)}
.no{background:var(--terra);border-color:var(--terra)}.yes{background:var(--kaki);border-color:var(--kaki)}
.no:hover{background:#A36452;border-color:#A36452}.yes:hover{background:var(--kaki-l);border-color:var(--kaki-l)}
.no small,.yes small{display:block;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;opacity:.8;font-weight:400;margin-bottom:2px}
.skipbtn{background:#B9B3AA;border-color:#B9B3AA;color:var(--white);font-size:.9rem}
.skipbtn:hover{background:var(--gris);border-color:var(--gris)}
@media (max-width:380px){.no,.yes,.skipbtn{font-size:.9rem;padding:12px 6px}}
.ghost{border:none;background:none;color:var(--gris);font-size:.78rem;padding:6px}
.ghost:disabled{opacity:.35;cursor:default}
.hint{font-size:.78rem;color:var(--gris);text-align:center;margin:0}

/* étape finale + récap */
.step h2{font-family:var(--display);font-weight:500;font-size:2.1rem;line-height:1.05;margin:4px 0;text-wrap:balance}
.lead{color:var(--gris);margin:0 0 6px;line-height:1.5}
.eyebrow{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--terra)}
fieldset{border:none;border-top:1px solid var(--beige);margin:0;padding:14px 0 4px}
legend{font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--kaki);padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{padding:8px 14px;font-size:.84rem}
.chip[aria-pressed="true"]{background:var(--kaki);color:var(--blanc);border-color:var(--kaki)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.78rem;color:var(--gris);margin-top:10px}
input,select,textarea{font-family:var(--body);font-size:1rem;font-weight:300;color:var(--noir);background:var(--white);border:1px solid var(--beige);border-radius:6px;padding:11px 12px;width:100%}
textarea{resize:vertical;min-height:84px;line-height:1.4}
.primary{background:var(--kaki);color:var(--blanc);border-color:var(--kaki);width:100%;margin-top:16px;font-weight:500;padding:14px}
.primary:hover{background:var(--kaki-l);border-color:var(--kaki-l)}
.recap{background:var(--white);border:1px solid var(--beige);border-radius:10px;padding:6px 18px;margin-top:10px}
.recap li{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--beige-l);font-size:.88rem}
.recap ul{list-style:none;margin:0;padding:0}
.recap li:last-child{border-bottom:none}
.recap li span:first-child{color:var(--gris)}
.recap li span:last-child{text-align:right;font-weight:400;min-width:0}
.team{display:flex;flex-direction:column;gap:10px;margin:14px 0 4px;background:var(--white);border:1px solid var(--beige);border-radius:10px;overflow:hidden}
.team img{width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.team .ph{width:100%;aspect-ratio:4/3;background:var(--beige-l)}
.team div{padding:0 16px 14px}
.team div{min-width:0}
.team b{display:block;font-family:var(--display);font-weight:500;font-size:1.35rem;line-height:1.1}
.team span{color:var(--gris);font-size:.85rem;line-height:1.45}
.site{display:block;text-align:center;font-size:.85rem;color:var(--kaki);padding:12px 14px;border:1px solid var(--beige);border-radius:10px;background:var(--white);text-decoration:none;line-height:1.45}
.site:hover{border-color:var(--kaki)}
.site u{text-decoration:underline;text-underline-offset:3px;color:var(--terra);font-weight:500}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.wa{background:var(--terra);color:var(--white);border-color:var(--terra);font-weight:500;padding:14px}
.wa:hover{background:#A36452;border-color:#A36452}
.note{font-size:.8rem;color:var(--kaki);text-align:center;min-height:1.2em;margin:0}
.foot-l{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;margin-top:4px}
.foot-l a{color:var(--kaki);text-decoration:underline;text-decoration-color:var(--beige-3);text-underline-offset:3px}
.foot-l a:hover{text-decoration-color:var(--kaki)}
.foot{font-size:.7rem;color:var(--gris);text-align:center;margin-top:auto;padding-top:10px;letter-spacing:.04em}

/* barre éditeur */
.adminbar{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--kaki-p);border-radius:8px;padding:8px 10px;font-size:.8rem;color:var(--kaki)}
.adminbar button{padding:7px 12px;font-size:.8rem}
.adminbar{flex-wrap:wrap}
.adminbar .save{background:var(--kaki);color:var(--blanc);border-color:var(--kaki)}

/* éditeur */
.ed{position:fixed;inset:0;background:var(--blanc);z-index:20;overflow-y:auto;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ed-in{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.ed-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--beige);padding-bottom:12px}
.ed h3{font-family:var(--display);font-weight:500;font-size:1.7rem;margin:0}
.ed h4{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--terra);margin:10px 0 0;font-weight:400}
.row{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:10px;border:1px solid var(--beige);border-radius:8px;background:var(--white)}
.row.off{opacity:.5}
.thumb{width:56px;height:44px;border-radius:5px;background:var(--beige-l);display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}.thumb svg{width:86%;height:86%}
.row .q{min-width:0}
.row .q b{display:block;font-weight:400;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .q small{color:var(--gris);font-size:.72rem}
.tools{display:flex;gap:4px}
.tools button{padding:6px 9px;font-size:.78rem;border-radius:6px}
.tools .del-confirm{background:var(--terra);color:var(--white);border-color:var(--terra)}
.form{background:var(--white);border:1px solid var(--kaki-p);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px;margin-top:8px}
.pick button{border-radius:6px;padding:4px;height:50px;background:var(--beige-l);display:flex;align-items:center;justify-content:center}
.pick button svg{width:100%;height:100%}
.pick button[aria-pressed="true"]{border:2px solid var(--terra);background:var(--terra-p)}
.pick .none{font-size:.66rem;color:var(--gris)}
.photo{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:.8rem;color:var(--gris)}
.photo img{height:54px;border-radius:5px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.check{display:flex;gap:8px;align-items:center;font-size:.85rem;margin-top:10px}
.check input{width:auto}
.add{border-style:dashed;color:var(--kaki)}
.status{font-size:.82rem;color:var(--kaki);min-height:1.2em;margin:0}
.status.err{color:var(--terra)}

/* illustrations */
.il{fill:none;stroke:var(--kaki);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.il .a{fill:var(--terra-p);stroke:var(--terra)}
.il .b{fill:var(--beige)}
.il .t{stroke:var(--terra)}
.il .k{fill:var(--kaki-p)}
.coach{position:absolute;inset:0;z-index:3;pointer-events:none;display:flex;align-items:flex-end;justify-content:center;padding-bottom:34%}
.coach .bulle{background:rgba(26,26,24,.82);color:var(--blanc);border-radius:999px;padding:10px 16px;font-size:.84rem;display:flex;align-items:center;gap:10px;box-shadow:0 10px 24px -12px rgba(0,0,0,.6);max-width:90%}
.coach .bulle span{line-height:1.3}
.coach svg{width:28px;height:28px;flex:none;animation:hand 2.2s ease-in-out infinite}
@keyframes hand{0%,100%{transform:translateX(-14px) rotate(-8deg)}50%{transform:translateX(14px) rotate(8deg)}}
@keyframes nudge{0%,100%{transform:translateX(0)}30%{transform:translateX(-6px)}70%{transform:translateX(6px)}}
.card.nudge{animation:nudge 2.6s ease-in-out 1}
.guide{font-size:.82rem;color:var(--kaki);text-align:center;margin:0 0 -4px;background:var(--kaki-p);border-radius:999px;padding:8px 14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ===== Swipe/Apimo : surcouche aux couleurs du site achille-immobilier.fr ===== */
:root{--display:"KENOKY","Gilda Display",Georgia,serif;--body:Roboto,Arial,sans-serif;--site-beige:#E2D8CB}
body{background:#fff;font-weight:400}
.app{max-width:440px}
header{flex-direction:column;align-items:center;gap:2px;border-bottom:0;padding-bottom:4px}
.ptitle{font-family:var(--display);font-weight:400;font-size:1.7rem;line-height:1.1;text-align:center;margin:4px 0 0;text-wrap:balance}
.count{letter-spacing:.06em;text-transform:none;font-size:.8rem;color:#777}
.bar{margin-top:0;background:#eee;border-radius:2px}
.foot{display:none}
.welcome{border-radius:16px;padding:30px 24px 26px}
.welcome .mono{width:54px}.welcome .logo-c{width:min(190px,60%)}
.welcome h1{font-family:var(--display);font-style:normal;font-size:2rem;line-height:1.12}
.welcome h1:after{content:"";display:block;width:60%;margin:14px auto 0;border-top:1px solid rgba(255,255,255,.6)}
.welcome p{color:#EDEAE3}
.how div{border-radius:12px}
.how b{font-family:var(--body);font-weight:500;font-size:.95rem}
.card{border-radius:16px;border:1px solid #eee;box-shadow:0 12px 26px -16px rgba(0,0,0,.45)}
.visual{background:#F3EEE8}
.txt{align-items:center;text-align:center}
.card h2{font-family:var(--body);font-weight:500;font-size:1.25rem;line-height:1.25}
.card p{font-size:1.02rem;color:#666}
.kicker{letter-spacing:.14em;color:#999}
.mono-w{display:none}
button,.btn{font-family:var(--body)}
.no,.yes,.skipbtn,.go,.primary,.wa{border-radius:999px;text-transform:uppercase;letter-spacing:1.6px;font-size:.74rem;font-weight:500}
.no,.yes,.skipbtn{min-height:60px}
.skipbtn{background:#A9A39A;border-color:#A9A39A}
.go{background:#B47360}
.guide{background:#F3EEE8;color:#555}
.step h2{font-family:var(--display);text-align:center}
.eyebrow,.step .lead{text-align:center}
legend{letter-spacing:.12em;color:#4C533B}
.chip{border-radius:999px}
.chip[aria-pressed="true"]{background:#4C533B}
.team{background:#4C533B;color:#fff;border:0;border-radius:16px}
.team b{color:#fff;font-family:var(--display)}
.team b:after{content:"";display:block;border-top:1px solid rgba(255,255,255,.6);margin:8px 0}
.team span{color:#EDEAE3}
.recap{border-radius:14px}
.site{border-radius:14px}
/* ===== Responsive : la page remplit son cadre (iframe ou plein écran), du petit téléphone au grand écran ===== */
body{padding-block:12px;overflow-x:hidden}
#root{height:100%}
.app{max-width:560px;gap:10px;min-height:0}
.app.s-welcome{min-height:100%}
.app.s-cards{height:100%;min-height:0;max-height:860px}
.dk{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.dk aside{display:none}
main{flex:1 1 auto;min-height:0;min-width:0;display:flex;flex-direction:column}
.ptitle{font-size:clamp(1.2rem,5.4vw,1.7rem)}
/* accueil */
.app.s-welcome{justify-content:center}
.s-welcome .dk,.s-welcome main{flex:0 0 auto}
.s-welcome header{padding-bottom:6px}
.welcome .go{white-space:nowrap;padding:14px clamp(16px,6vw,34px);font-size:clamp(.66rem,3vw,.74rem)}
.s-final .count,.s-recap .count{display:none}
.welcome{padding:clamp(20px,6vw,36px) clamp(16px,5vw,44px);gap:clamp(10px,3vw,16px)}
.welcome h1{font-size:clamp(1.4rem,6.6vw,2.1rem);margin-top:0}
.welcome p{max-width:46ch;font-size:clamp(.86rem,3.7vw,1rem)}
.how{max-width:560px}
.how div{padding:9px 5px;font-size:clamp(.64rem,2.9vw,.76rem)}
.how b{font-size:clamp(.8rem,3.6vw,.95rem)}
/* cartes : la carte prend la hauteur disponible, les boutons restent toujours visibles */
.s-cards main{justify-content:center;gap:10px}
.guide{margin:0 auto;width:100%;max-width:460px;font-size:clamp(.72rem,3.3vw,.82rem);padding:7px 12px}
.stack{flex:1 1 auto;height:auto;min-height:230px;max-height:540px;width:100%;max-width:460px;margin-inline:auto}
.visual{flex:1 1 50%;min-height:96px}
.visual svg{max-height:100%}
.txt{flex:0 0 auto;padding:12px 16px 14px}
.kicker{font-size:clamp(.58rem,2.6vw,.66rem)}
.card h2{font-size:clamp(1.02rem,4.7vw,1.3rem);margin-top:4px}
.card p{font-size:clamp(.88rem,4vw,1.04rem);margin-top:5px;line-height:1.4}
.controls{width:100%;max-width:460px;margin-inline:auto;gap:8px}
.no,.yes,.skipbtn{min-height:56px;padding:8px 6px;font-size:.66rem;letter-spacing:.5px;overflow-wrap:anywhere}
.no,.yes{flex-direction:column;gap:2px}
.no i,.yes i{font-style:normal;font-size:1.05rem;line-height:1;letter-spacing:0}
.yes i{order:-1}
.undo{display:flex;justify-content:center;margin-top:-4px}
.coach{align-items:flex-start;padding:0;padding-top:14%}
.coach .bulle{font-size:clamp(.74rem,3.4vw,.84rem);padding:8px 14px}
@media (min-width:380px){.no,.yes,.skipbtn{font-size:.72rem;letter-spacing:1px}}
@media (min-width:440px){.no,.yes,.skipbtn{font-size:.74rem;letter-spacing:1.5px;min-height:60px}}
@media (min-width:600px){
  body{padding:16px 22px}
  .no,.yes{flex-direction:row;gap:8px}
  .yes i{order:1}
}
/* cadre peu haut (petit téléphone, ordinateur portable) : on garde l'essentiel */
@media (max-height:640px){.s-cards .ptitle,.s-cards .guide{display:none}.s-cards header{padding-bottom:0}}
@media (max-height:520px){.no,.yes,.skipbtn{min-height:48px}.undo .ghost{padding:2px 6px}.txt{padding:8px 14px 10px}}
/* formulaire et résultat : deux colonnes dès que la place existe */
@media (min-width:760px){
  .app.s-final,.app.s-recap{max-width:940px}
  #ff{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 48px;align-items:start}
  #ff .primary{grid-column:1/-1;max-width:360px;justify-self:center}
  .s-recap .step{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 48px;align-items:start}
  .s-recap .step>.eyebrow,.s-recap .step>h2,.s-recap .step>.lead{grid-column:1/-1}
  .s-recap .team{grid-column:1;grid-row:4}
  .s-recap .actions{grid-column:1;grid-row:5}
  .s-recap .recap{grid-column:2;grid-row:4/span 2;margin-top:14px}
}
/* ordinateur : texte à gauche, carte à droite */
@media (min-width:900px){
  body{padding:18px 32px}
  .app{max-width:1060px}
  .app.s-welcome .welcome{width:100%;max-width:800px;margin-inline:auto}
  .welcome h1{font-size:2.3rem;max-width:24ch}
  .s-cards header{align-items:flex-end}
  .s-cards .ptitle{display:none}
  .s-cards .dk{display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,460px);grid-template-rows:minmax(0,1fr);gap:clamp(36px,6vw,80px);align-items:stretch}
  .s-cards .dk aside{display:block;align-self:center}
  .dk aside h2{font-family:var(--display);font-weight:400;font-size:clamp(1.9rem,3.2vw,2.5rem);line-height:1.1;margin:6px 0 12px}
  .dk aside hr{border:0;border-top:1px solid #ccc;width:70%;margin:0 0 16px}
  .dk aside p{font-size:.98rem;line-height:1.65;color:#444;margin:0 0 12px;max-width:48ch}
  .dk-k{font-size:.72rem!important;letter-spacing:.18em;text-transform:uppercase;color:#B47360!important}
  .dk-team{display:flex;gap:14px;align-items:center;margin-top:18px}
  .dk-team img{width:110px;aspect-ratio:4/3;object-fit:cover;border-radius:12px}
  .dk-team div{font-size:.85rem;color:#555;line-height:1.45}
  .dk-team b{display:block;font-family:var(--display);font-weight:400;font-size:1.25rem;color:#111}
}
@media (min-width:900px) and (max-height:560px){.dk-team{display:none}}
.merci{font-family:var(--display);font-size:1.35rem;line-height:1.2;text-align:center;color:var(--kaki);margin:10px 0 2px}
.lien{border:0;background:none;padding:0;font:inherit;color:var(--kaki);text-decoration:underline;text-underline-offset:3px;border-radius:0;cursor:pointer}
.coach{align-items:flex-start;padding:0;padding-top:14%}
.ghost[data-act="undo"]{font-size:.9rem;font-weight:400;color:var(--kaki);padding:8px 16px;text-decoration:underline;text-decoration-color:var(--beige-3);text-underline-offset:4px}
.ghost[data-act="undo"]:disabled{opacity:.4;text-decoration:none}

.txt .coach{position:static;inset:auto;display:flex;align-items:center;justify-content:center;padding:14px 0 6px}
.txt .coach .bulle{max-width:none}.txt .coach .bulle span{white-space:nowrap}
/* ===== Carte d'accueil : elle occupe toute la hauteur du cadre, comme les cartes de questions (Laurent, 13/11).
   L'espace libre est réparti entre les blocs : davantage autour du logo, un peu plus entre le texte, les trois gestes et le bouton.
   Cadre trop petit : les espaces reviennent à leur minimum et la page défile, comme avant. ===== */
.s-welcome .dk,.s-welcome main{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center}
.welcome{flex:1 1 auto;max-height:780px;display:grid;justify-items:center;align-content:stretch;gap:0;
  grid-template-rows:auto minmax(14px,1.5fr) auto minmax(18px,1.6fr) auto minmax(12px,.7fr) auto minmax(16px,1.1fr) auto minmax(16px,1.1fr) auto}
.welcome>.mono{grid-row:1}.welcome>.logo-c{grid-row:3}.welcome>h1{grid-row:5}.welcome>p{grid-row:7}.welcome>.how{grid-row:9;margin-top:0}.welcome>.go{grid-row:11;margin-top:0}
/* le bas de la carte d'accueil s'aligne sur le bas des trois boutons des cartes suivantes (la place du lien « Carte précédente ») :
   sur le site, le bouton « Commencer » reste visible sans faire défiler la page */
@media (min-height:680px){.welcome{margin-bottom:38px}}
/* ===== Envoi direct de la recherche à l'agence (Laurent, 13/11) : accord, mention d'information, confirmation ===== */
.accord{padding-top:16px}
.ck{display:flex;gap:10px;align-items:flex-start;text-align:left;font-size:.92rem;line-height:1.4;color:var(--noir);cursor:pointer}
.ck input{flex:none;width:20px;height:20px;margin:1px 0 0;accent-color:#4C533B}
.rgpd{font-size:.72rem;line-height:1.5;color:var(--gris);margin:10px 0 0;text-align:left}
.hp{position:absolute;left:-9999px;top:auto;width:1px;height:1px;opacity:0}
.sent{margin:12px 0 0;padding:10px 16px;border-radius:999px;background:#EEF1E6;color:#4C533B;font-size:.9rem;font-weight:500;text-align:center}
.sent.ko{background:#FBEFEA;color:#8F5543;border-radius:14px;font-weight:400;line-height:1.45}
.primary[disabled]{opacity:.6;cursor:progress}
@media (min-width:760px){#ff .accord{grid-column:1/-1;max-width:640px;justify-self:center}.s-recap .step>.sent{grid-column:1/-1;grid-row:4;justify-self:center;margin:10px 0 2px}.s-recap .step>.sent~.team{grid-row:5}.s-recap .step>.sent~.actions{grid-row:6}.s-recap .step>.sent~.recap{grid-row:5/span 2}}

function summary(){
  const rows=[],flex=[];
  if(fin.sect.length)rows.push(['Secteur',fin.sect.join(', ')]);
  if(fin.budget)rows.push(['Budget',fin.budget]);
  if(fin.pieces)rows.push([fin.unit||'Pièces',fin.pieces]);
  active().forEach(c=>{const v=ans[c.id];
    if(v==null){flex.push(c.type==='yn'?(c.lab||c.q):c.kicker);return;}
    rows.push(c.type==='yn'?[c.lab||c.q,v?'Oui':'Non']:[c.kicker,v]);});
  return {rows,flex};
}
function pointue(){
  const seuil=+deck.seuilPointu||8;
  let oui=0;active().forEach(c=>{if(c.type==='yn'&&ans[c.id]===true)oui++;});
  const bas=deck.budgets&&fin.budget===deck.budgets[0];
  const grand=(fin.unit==='Chambres'&&['4','5 et +'].includes(fin.pieces))||(fin.unit!=='Chambres'&&['5','6 et +'].includes(fin.pieces));
  const maison=Object.values(ans).includes('Maison');
  return oui>=seuil||(bas&&(maison||grand))||(bas&&oui>=seuil-2);
}
function message(){
  const {rows,flex}=summary();

  if(fin.prenom)m+=`Prénom : ${fin.prenom}\n`; if(fin.tel)m+=`Téléphone : ${fin.tel}\n`; if(fin.email)m+=`E-mail : ${fin.email}\n`;
  if(fin.contact)m+=`Je préfère échanger par : ${fin.contact}\n`;
  rows.forEach(([a,b])=>m+=`• ${a} : ${b}\n`); if(flex.length)m+=`Peu importe : ${flex.join(', ')}\n`; if(fin.note)m+=`Précision : ${fin.note}`;
  return m.trim();
}
function drag(el){
  let x0=0,y0=0,dx=0,dy=0,on=false;const sl=el.querySelector('.stamp.l'),sr=el.querySelector('.stamp.r'),sd=el.querySelector('.stamp.d');
  el.addEventListener('pointerdown',e=>{on=true;x0=e.clientX;y0=e.clientY;dx=0;dy=0;el.setPointerCapture(e.pointerId);el.style.transition='none';el.style.cursor='grabbing'});
  el.addEventListener('pointermove',e=>{if(!on)return;dx=e.clientX-x0;dy=e.clientY-y0;
    const down=dy>0&&Math.abs(dx)<70&&dy>Math.abs(dx);
    el.style.transform=down?`translate(${dx*.3}px,${dy*.6}px)`:`translate(${dx}px,${dy*.25}px) rotate(${dx/18}deg)`;
    sl.style.opacity=down?0:Math.max(0,-dx/90);sr.style.opacity=down?0:Math.max(0,dx/90);sd.style.opacity=down?Math.max(0,(dy-20)/90):0});
  const end=()=>{if(!on)return;on=false;el.style.cursor='grab';
    const down=dy>90&&Math.abs(dx)<70&&dy>Math.abs(dx);
    if(down)fly(el,'skip');else if(dx>90)fly(el,'right');else if(dx<-90)fly(el,'left');else{el.style.transition='transform .25s';el.style.transform='';sl.style.opacity=0;sr.style.opacity=0;sd.style.opacity=0}};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}
function fly(el,dir){
  if(!el||el.dataset.gone)return;el.dataset.gone=1;
  const c=active()[i];
  ans[c.id]=dir==='skip'?null:c.type==='yn'?dir==='right':(dir==='left'?c.a:c.b);hist.push(i);
  el.querySelector(dir==='left'?'.stamp.l':dir==='right'?'.stamp.r':'.stamp.d').style.opacity=1;
  el.style.transition=reduce?'none':'transform .32s ease-in,opacity .32s';
  el.style.transform=`translate(${dir==='left'?'-140%':dir==='right'?'140%':'0'},${dir==='skip'?'130%':'0'}) rotate(${dir==='left'?-16:dir==='right'?16:0}deg)`;el.style.opacity=0;
  setTimeout(()=>{i++;render()},reduce?0:290);
}
function undo(){if(!hist.length)return;['prenom','tel','email','note'].forEach(f=>{const el=document.getElementById(f);if(el&&screen==='final')fin[f]=el.value.trim();});i=hist.pop();delete ans[active()[i].id];screen='cards';render();}

/* ---------- éditeur ---------- */
const newId=()=>'c'+Date.now().toString(36);
function pickHTML(field,cur){
  return `<div class="pick"><button type="button" class="none" data-pick="${field}" data-v="" aria-pressed="${!cur}">Aucune</button>${Object.keys(IL).map(k=>`<button type="button" title="${IL_NAMES[k]}" aria-label="${IL_NAMES[k]}" data-pick="${field}" data-v="${k}" aria-pressed="${cur===k}">${svg(k)}</button>`).join('')}</div>`;
}
function formHTML(c){
  return `<div class="form" id="form">
    <div class="two"><label class="f" for="e-type">Type de carte<select id="e-type" data-f="type"><option value="yn" ${c.type==='yn'?'selected':''}>Oui / Non</option><option value="ab" ${c.type==='ab'?'selected':''}>Choix entre deux</option></select></label>
    <label class="f" for="e-kicker">Rubrique<input id="e-kicker" data-f="kicker" value="${esc(c.kicker)}" placeholder="Ex. Dehors"></label></div>
    <label class="f" for="e-q">Question<input id="e-q" data-f="q" value="${esc(c.q)}" placeholder="Ex. Un jardin ?"></label>
    <label class="f" for="e-p">Précision (facultatif)<input id="e-p" data-f="p" value="${esc(c.p)}"></label>
    ${c.type==='yn'?`<label class="f" for="e-lab">Nom du critère dans le récap<input id="e-lab" data-f="lab" value="${esc(c.lab)}" placeholder="Ex. Jardin"></label>`
      :`<div class="two"><label class="f" for="e-a">Option de gauche<input id="e-a" data-f="a" value="${esc(c.a)}"></label><label class="f" for="e-b">Option de droite<input id="e-b" data-f="b" value="${esc(c.b)}"></label></div>`}
    <h4>Visuel</h4>
    <div class="photo">${c.img?`<img src="${esc(c.img)}" alt="Photo de la carte"><button type="button" data-act="rmimg">Retirer la photo</button>`:'<span>Une photo remplace l\'illustration.</span>'}
      <span class="btn filebtn">${c.img?'Changer la photo':'Ajouter une photo'}<input type="file" id="e-img" accept="image/*"></span></div>
    ${c.img?'':c.type==='yn'?`<label class="f">Illustration</label>${pickHTML('ill',c.ill)}`
      :`<label class="f">Illustration de gauche</label>${pickHTML('ia',c.ia)}<label class="f">Illustration de droite</label>${pickHTML('ib',c.ib)}`}
    <label class="check"><input type="checkbox" id="e-on" ${c.on!==false?'checked':''}> Carte visible dans le jeu</label>
    <button class="primary" type="button" data-act="closeform">Terminé</button></div>`;
}
function editorHTML(){
  const n=deck.cards.length;
  const list=deck.cards.map((c,k)=>{
    const th=c.img?`<img src="${esc(c.img)}" alt="">`:svg(c.type==='ab'?(c.ia||c.ill):c.ill);
    const row=`<div class="row ${c.on===false?'off':''}"><div class="thumb">${th}</div><div class="q"><b>${esc(c.q||'Nouvelle carte')}</b><small>${c.type==='yn'?'Oui / Non':esc((c.a||'')+' ou '+(c.b||''))}${c.on===false?' · masquée':''}${c.hideIf?' · sautée si « '+esc(Object.values(c.hideIf).join(', '))+' »':''}</small></div>
      <div class="tools"><button data-ed="up" data-k="${k}" aria-label="Monter" ${k?'':'disabled'}>↑</button><button data-ed="down" data-k="${k}" aria-label="Descendre" ${k<n-1?'':'disabled'}>↓</button>
      <button data-ed="edit" data-k="${k}">${editId===c.id?'Fermer':'Modifier'}</button><button data-ed="del" data-k="${k}" class="${c._del?'del-confirm':''}">${c._del?'Confirmer':'Suppr.'}</button></div></div>`;
    return row+(editId===c.id?formHTML(c):'');
  }).join('');
  return `<div class="ed" role="dialog" aria-label="Gérer les cartes"><div class="ed-in">
   <div class="ed-head"><h3>Gérer les cartes</h3><span style="display:flex;gap:8px;flex-wrap:wrap"><button data-act="closeed">Tester le jeu</button><button class="primary" style="width:auto;margin:0;padding:10px 18px" data-act="save" ${dirty()?'':'disabled'}>Enregistrer</button></span></div>
   <p class="status ${status.err?'err':''}" aria-live="polite">${esc(status.t)}</p>
   <h4>Les cartes · ${active().length} visibles sur ${n}</h4>${list}
   <button class="add" data-act="add">+ Ajouter une carte</button>
   <h4>Accueil</h4>
   <label class="f" for="s-wt">Titre d'accueil<input id="s-wt" data-s="welcomeTitle" value="${esc(deck.welcomeTitle)}"></label>
   <label class="f" for="s-wx">Texte d'accueil<input id="s-wx" data-s="welcomeText" value="${esc(deck.welcomeText)}"></label>
   <h4>Dernière étape</h4>
   <div class="two"><label class="f" for="s-sect">Secteurs (un par ligne)<textarea id="s-sect" data-l="secteurs">${esc(deck.secteurs.join('\n'))}</textarea></label>
   <label class="f" for="s-bud">Budgets (un par ligne)<textarea id="s-bud" data-l="budgets">${esc(deck.budgets.join('\n'))}</textarea></label></div>
   <div class="two"><label class="f" for="s-pie">Pièces (un par ligne)<textarea id="s-pie" data-l="pieces">${esc(deck.pieces.join('\n'))}</textarea></label>
   <label class="f" for="s-cha">Chambres (un par ligne)<textarea id="s-cha" data-l="chambres">${esc((deck.chambres||[]).join('\n'))}</textarea></label></div>
   <div class="two"><label class="f" for="s-wa">Numéro WhatsApp (format international)<input id="s-wa" data-s="whatsapp" value="${esc(deck.whatsapp)}"></label>
   <label class="f" for="s-pl">Numéro affiché<input id="s-pl" data-s="phoneLabel" value="${esc(deck.phoneLabel)}"></label></div>
   <label class="f" for="s-em">E-mail de réception<input id="s-em" type="email" data-s="email" value="${esc(deck.email)}"></label>
   <h4>Page de fin</h4>
   <label class="f" for="s-ok">Phrase si la recherche est réaliste<input id="s-ok" data-s="phraseOk" value="${esc(deck.phraseOk||'')}"></label>
   <label class="f" for="s-po">Phrase si la recherche est très pointue<input id="s-po" data-s="phrasePointue" value="${esc(deck.phrasePointue||'')}"></label>
   <label class="f" for="s-se">« Très pointue » à partir de ce nombre de « oui » (ou petit budget + maison / grand logement)<input id="s-se" type="number" min="1" data-s="seuilPointu" value="${esc(deck.seuilPointu||8)}"></label>
   <label class="f" for="s-tn">Prénoms affichés<input id="s-tn" data-s="teamNames" value="${esc(deck.teamNames||'')}"></label>
   <label class="f" for="s-ra">Phrase de rappel (si l'envoi automatique n'a pas marché)<input id="s-ra" data-s="rappel" value="${esc(deck.rappel||'')}"></label>
   <label class="f" for="s-ro">Phrase de rappel (recherche bien reçue)<input id="s-ro" data-s="rappelOk" value="${esc(tx('rappelOk'))}"></label>
   <label class="f" for="s-ac">Case d'accord (dernière étape)<textarea id="s-ac" rows="2" data-s="accordText">${esc(tx('accordText'))}</textarea></label>
   <label class="f" for="s-mn">Mention d'information (sous la case)<textarea id="s-mn" rows="5" data-s="mentionText">${esc(tx('mentionText'))}</textarea></label>
   <div class="photo">${deck.teamPhoto?`<img src="${esc(deck.teamPhoto)}" alt="Photo de l'équipe" style="height:72px;border-radius:6px"><button type="button" data-act="rmteam">Retirer la photo</button>`:'<span>Votre photo, affichée au-dessus de vos prénoms.</span>'}
     <span class="btn filebtn">${deck.teamPhoto?'Changer la photo':'Ajouter votre photo'}<input type="file" id="e-team" accept="image/*"></span></div>
   <label class="f" for="s-si">Adresse du site<input id="s-si" data-s="site" value="${esc(deck.site||'')}"></label>
   <label class="f" for="s-st">Phrase vers le site<input id="s-st" data-s="siteText" value="${esc(deck.siteText||'')}"></label>
   <h4>Mise en ligne</h4>
   <p class="lead" style="font-size:.85rem">Cette page est privée. Pour vos clients, téléchargez la version publique (sans ce panneau) et mettez-la en ligne.</p>
   ${downloadsNs?'<button data-act="export">Télécharger la version publique</button>':'<p class="lead" style="font-size:.85rem">Téléchargement indisponible dans cette vue.</p>'}
  </div></div>`;
}
function cleanDeck(d){const c=JSON.parse(JSON.stringify(d));c.cards.forEach(x=>delete x._del);return c;}
function buildDoc(d){
  const css=document.getElementById('app-css').textContent, js=document.getElementById('app-js').textContent;
  const json=JSON.stringify(cleanDeck(d)).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'
   +'<title>Achille ImmoSwipe</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'+FONTS+'\n<style id="app-css">'+css+'</style>\n<div id="root"></div>\n<script type="application/json" id="deck">'+json+'<\/script>\n<script id="app-js">'+js+'<\/script></body></html>';
}
async function save(){
  if(!artifactNs)return;status={t:'Enregistrement…',err:false};render();
  try{await artifactNs.publish(buildDoc(deck));status={t:'Enregistré.',err:false};}
  catch(e){const c=e&&e.code;status={t:c==='conflict'?'Une autre version vient d\'être enregistrée, la page se recharge.':c==='not_writer'||c==='not_granted'?'Cette page est en lecture seule pour vous.':'Enregistrement impossible pour le moment, réessayez.',err:true};if(c==='not_writer'||c==='not_granted')canEdit=false;}
  render();
}
async function exportPublic(){
  const d=cleanDeck(deck);d.public=true;
  try{await downloadsNs.save({filename:'swipe-achille.html',data:new Blob([buildDoc(d)],{type:'text/html'})});status={t:'Fichier téléchargé.',err:false};}
  catch(e){status={t:e&&e.code==='declined'?'Téléchargement annulé.':'Téléchargement impossible ici.',err:e&&e.code!=='declined'};}
  render();
}
function loadImg(file,cb){
  const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
    const s=Math.min(1,900/Math.max(im.width,im.height)),w=Math.round(im.width*s),h=Math.round(im.height*s);
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);cb(cv.toDataURL('image/jpeg',.82));};
    im.onerror=()=>{status={t:'Ce fichier n\'est pas une image lisible.',err:true};render();};im.src=r.result;};r.readAsDataURL(file);
}
const cur=()=>deck.cards.find(c=>c.id===editId);

/* ---------- événements ---------- */
root.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-act]');if(!b)return;
  const a=b.dataset.act, top=document.querySelector('.card:not(.under)');
  if(a==='start'){screen='cards';i=0;render();}
  else if(a==='left'||a==='right'||a==='skip'){coached=true;fly(top,a);}
  else if(a==='undo')undo();
  else if(a==='copy'){const n=document.getElementById('note');navigator.clipboard.writeText(message()).then(()=>n.textContent='Recherche copiée.').catch(()=>n.textContent='Copie impossible ici : faites une capture d\'écran.');}
  else if(a==='restart'){screen='welcome';i=0;ans={};hist=[];accord=false;envoi='';fin={sect:[],budget:'',unit:'Pièces',pieces:'',contact:'',prenom:'',tel:'',email:'',note:''};render();}
  else if(a==='demo'){
    ans={};active().forEach((c,k)=>{ans[c.id]=k%5===4?null:c.type==='yn'?(k%3!==2):(k%2?c.b:c.a);});
    fin={sect:['Neuilly-sur-Seine','Paris 16e'],budget:(deck.budgets||[])[3]||'',unit:'Pièces',pieces:'4',contact:'WhatsApp',prenom:'Camille',tel:'06 00 00 00 00',email:'',note:'Exemple de précision : pas de rez-de-chaussée.'};
    hist=[];i=active().length;screen='recap';render();scrollTo(0,0);}
  else if(a==='editor'){edOpen=true;status={t:'',err:false};render();}
  else if(a==='closeed'){edOpen=false;editId=null;screen='welcome';i=0;ans={};hist=[];render();}
  else if(a==='save')save();
  else if(a==='export')exportPublic();
  else if(a==='add'){const c={id:newId(),type:'yn',kicker:'',q:'',p:'',lab:'',ill:'',on:true};deck.cards.push(c);editId=c.id;render();document.getElementById('e-q')?.focus();}
  else if(a==='closeform'){editId=null;render();}
  else if(a==='rmimg'){delete cur().img;render();}
  else if(a==='rmteam'){delete deck.teamPhoto;render();}
  if(b.dataset.chip){const k=b.dataset.chip,v=b.dataset.v;
    if(b.dataset.m==='1'){fin[k]=fin[k].includes(v)?fin[k].filter(x=>x!==v):[...fin[k],v];b.setAttribute('aria-pressed',fin[k].includes(v));}
    else{fin[k]=fin[k]===v?'':v;document.querySelectorAll(`[data-chip="${k}"]`).forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===fin[k]));}
    if(k==='unit'){if(!fin.unit)fin.unit='Pièces';fin.pieces='';}
    if(k==='contact'||k==='unit'){['prenom','tel','email','note'].forEach(f=>{const el=document.getElementById(f);if(el)fin[f]=el.value.trim();});const y=scrollY;render();scrollTo(0,y);}}
  if(b.dataset.ed){const k=+b.dataset.k,c=deck.cards;
    if(b.dataset.ed==='up'&&k){[c[k-1],c[k]]=[c[k],c[k-1]];}
    if(b.dataset.ed==='down'&&k<c.length-1){[c[k+1],c[k]]=[c[k],c[k+1]];}
    if(b.dataset.ed==='edit')editId=editId===c[k].id?null:c[k].id;
    if(b.dataset.ed==='del'){if(c[k]._del){if(editId===c[k].id)editId=null;c.splice(k,1);}else{c.forEach(x=>delete x._del);c[k]._del=true;}}
    else deck.cards.forEach(x=>delete x._del);
    const y=document.querySelector('.ed')?.scrollTop;render();const ed=document.querySelector('.ed');if(ed&&y!=null)ed.scrollTop=y;}
  if(b.dataset.pick){cur()[b.dataset.pick]=b.dataset.v;document.querySelectorAll(`[data-pick="${b.dataset.pick}"]`).forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===b.dataset.v));refreshBar();}
});
function refreshBar(){const s=document.querySelector('.ed [data-act="save"]');if(s)s.disabled=!dirty();}
root.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.f&&t.dataset.f!=='type'){cur()[t.dataset.f]=t.value;refreshBar();}
  if(t.dataset.s){deck[t.dataset.s]=t.value;refreshBar();}
  if(t.dataset.l){deck[t.dataset.l]=t.value.split('\n').map(x=>x.trim()).filter(Boolean);refreshBar();}
});
root.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='e-type'){const c=cur();c.type=t.value;if(c.type==='ab'){c.a=c.a||'Option A';c.b=c.b||'Option B';}render();}
  if(t.id==='e-on'){cur().on=t.checked;render();}
  if(t.id==='e-img'&&t.files[0]){const c=cur();loadImg(t.files[0],u=>{c.img=u;render();});}
  if(t.id==='e-team'&&t.files[0]){loadImg(t.files[0],u=>{deck.teamPhoto=u;render();});}
});
root.addEventListener('submit',e=>{if(e.target.id!=='ff')return;e.preventDefault();
  const tel=document.getElementById('tel'), ac=document.getElementById('accord'), bt=e.target.querySelector('.primary');
  tel.setCustomValidity('');
  if(!tel.value.trim()&&!document.getElementById('email').value.trim()){tel.setCustomValidity('Indiquez un téléphone ou un e-mail pour que nous puissions vous répondre.');tel.reportValidity();return;}
  if(fin.contact==='WhatsApp'&&!tel.value.trim()){tel.setCustomValidity('Indiquez votre numéro WhatsApp.');tel.reportValidity();return;}
  ['prenom','tel','email','note'].forEach(f=>fin[f]=document.getElementById(f).value.trim());accord=!!(ac&&ac.checked);
  if(bt.disabled)return;bt.disabled=true;bt.textContent='Envoi en cours…';
  const piege=(document.getElementById('site-web')||{}).value;   /* champ invisible : seul un robot le remplit */
  (piege?Promise.resolve(true):deposer()).then(ok=>{envoi=ok?'ok':'echec';screen='recap';render();});});
root.addEventListener('input',e=>{if(e.target.id==='tel'||e.target.id==='email'){const t=document.getElementById('tel');if(t)t.setCustomValidity('');}if(e.target.id==='accord')accord=e.target.checked;});
document.addEventListener('keydown',e=>{
  if(screen!=='cards'||edOpen||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  const top=document.querySelector('.card:not(.under)');
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'||e.key==='ArrowDown')e.preventDefault();
  if(e.key==='ArrowLeft')fly(top,'left');if(e.key==='ArrowRight')fly(top,'right');if(e.key==='ArrowDown')fly(top,'skip');
});
const _undo=undo; undo=function(){if(screen==='final'){if(!hist.length)return;['prenom','tel','email','note'].forEach(f=>{const el=document.getElementById(f);if(el)fin[f]=el.value.trim();});i=hist.pop();delete ans[active()[i].id];screen='cards';render();}else _undo();};

/* ---------- intégration dans un site (iframe) ----------
   La page prévient le site hôte : hauteur utile des écrans longs (formulaire, résultat) et retour en haut à chaque changement d'écran.
   Sans écoute côté hôte, rien ne change : la page défile simplement dans son cadre. */
let _scr=null;
const _post=m=>{if(EMB){try{parent.postMessage(m,'*');}catch(e){}}};
function _height(){
  const a=document.querySelector('.app'),long=(screen==='final'||screen==='recap')&&!edOpen;
  _post({type:'immoswipe:height',height:long&&a?Math.ceil(a.getBoundingClientRect().height)+40:0,screen});
}
const _render=render; render=function(){
  _render();
  if(screen!==_scr){if(_scr!==null){try{scrollTo(0,0);}catch(e){}_post({type:'immoswipe:top',screen});}_scr=screen;}
  _height();
  if(EMB&&window.ResizeObserver){const a=document.querySelector('.app');if(a){if(window._ro)window._ro.disconnect();window._ro=new ResizeObserver(()=>_height());window._ro.observe(a);}}
};
addEventListener('resize',()=>_height());

render();
if(!deck.public&&window.claude&&window.claude.use){
  Promise.all([claude.use('artifact'),claude.use('user'),claude.use('downloads')]).then(async([art,usr,dl])=>{
    artifactNs=art;downloadsNs=dl;
    let ok=false;try{ok=usr?await usr.canEdit():false;}catch(e){}
    canEdit=!!(art&&ok);if(canEdit)render();
  }).catch(()=>{});
}
})();
</script></body></html>
